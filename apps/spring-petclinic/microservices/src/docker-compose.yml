name: petclinic-microservices

services:
  customers:
    build:
      context: ./customers
    ports:
      - "8092:80"
      - "8093:81"
  vets:
    build:
      context: ./vets
    ports:
      - "8094:80"
      - "8095:81"
  visits:
    build:
      context: ./visits
      args:
        GRAFT_GUID: ${GRAFT_GUID}
    depends_on:
      - customers
    environment:
      CUSTOMERS_GRAFT_HOST: ws://customers/ws
    ports:
      - "8096:80"
      - "8097:81"
